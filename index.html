<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fairway AI installs done-for-you AI automation for golf instructors and small courses — instant lead follow-up, no-show reduction, review generation, and 24/7 FAQ answers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fairway AI — AI Automation for Golf Instructors & Courses" />
    <meta
      property="og:description"
      content="Stop losing lessons to missed calls and no-shows. AI automation that runs your front desk so you don't have to."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fairway AI — AI Automation for Golf Instructors & Courses" />
    <meta
      name="twitter:description"
      content="Stop losing lessons to missed calls and no-shows. AI automation that runs your front desk so you don't have to."
    />
    <title>Fairway AI — AI Automation for Golf Instructors & Courses</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static form so Netlify's build-time bot can discover and register
      "audit-request" as a Netlify Form. Never rendered — the visible form
      lives in src/components/AuditForm.tsx and posts to this form name.
      See README for Netlify Forms setup.
    -->
    <form name="audit-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="text" name="painPoint" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
